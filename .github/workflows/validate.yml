name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run deterministic core tests
        env:
          PYTHONPATH: custom_components
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components tests

  test-home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate native flows and facial discovery
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace
          -e PYTHONPATH=/workspace/custom_components:/workspace/tests
          -e PYTHONDONTWRITEBYTECODE=1
          --entrypoint python3
          ghcr.io/home-assistant/home-assistant:2026.9.3
          -m unittest discover -s tests -p test_ha_configuration.py -v
