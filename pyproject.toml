[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presence-engine-core"
version = "0.1.0"
description = "Deterministic, platform-independent presence evidence engine"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "David R. Bustos" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

