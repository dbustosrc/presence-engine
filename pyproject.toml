[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presence-engine"
version = "0.4.1"
description = "Home Assistant presence evidence integration with a deterministic core"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "David R. Bustos" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "custom_components"}

[tool.setuptools.packages.find]
where = ["custom_components"]
include = ["presence_engine*"]

[tool.ruff]
line-length = 100
target-version = "py313"
